<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>キャンプモルック | きぼうキャンプラボ</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DotGothic16&display=swap');
  *{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:#0c1208;color:#f3efe4;font-family:'DotGothic16',monospace;}
  body{min-height:100vh;background:radial-gradient(900px 400px at 50% -10%,rgba(120,180,90,.10),transparent 60%),#0c1208;}
  #app{max-width:440px;margin:0 auto;padding:8px 8px 16px;}
  .scorebar{display:flex;gap:8px;align-items:stretch;margin-bottom:8px;}
  .sc{flex:1;background:#1c2417;border:1px solid #3a4a2a;border-radius:12px;padding:6px 10px;text-align:center;}
  .sc.turn{border-color:#ffb24a;box-shadow:0 0 0 2px rgba(255,178,74,.25);}
  .sc .who{font-size:12px;color:#a7b89a;}
  .sc .pt{font-size:28px;line-height:1.1;color:#fff;}
  .sc .pt small{font-size:12px;color:#7e8e72}
  .sc .dots{font-size:11px;color:#e2624a;height:14px;}
  .vs{display:flex;align-items:center;color:#7e8e72;font-size:12px;}
  .lvlbar{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#a7b89a;margin-bottom:6px;padding:0 4px;}
  .lvlbar b{color:#ffd166}
  .field-wrap{position:relative;width:100%;aspect-ratio:480/600;background:#000;border-radius:12px;overflow:hidden;box-shadow:0 8px 28px rgba(0,0,0,.5);}
  canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;}
  .toast{position:absolute;left:10px;right:10px;top:8px;background:rgba(10,16,6,.84);border:1px solid #4a5a32;border-radius:10px;
    padding:7px 12px;font-size:13.5px;text-align:center;z-index:4;min-height:34px;display:flex;align-items:center;justify-content:center;}
  .toast b{color:#ffd166}
  .wind{position:absolute;right:10px;top:48px;background:rgba(10,16,6,.7);border:1px solid #4a5a32;border-radius:8px;padding:3px 8px;font-size:12px;z-index:4;color:#bfe0ff;}
  .tapcue{position:absolute;left:0;right:0;bottom:8px;text-align:center;color:#fff;z-index:4;font-size:13px;text-shadow:0 1px 4px #000;animation:bl 1s steps(2) infinite;}
  @keyframes bl{50%{opacity:.35}}
  .bottom{display:flex;gap:8px;margin-top:10px;}
  .btn{flex:1;font-family:inherit;background:#23311a;border:1px solid #4a5a32;color:#e9f0df;border-radius:10px;padding:11px;font-size:14px;cursor:pointer;}
  .btn:active{background:#2e3f20}
  .hint{text-align:center;color:#5e6b4e;font-size:11px;margin-top:9px;line-height:1.6}
  .modal{position:absolute;inset:0;z-index:20;background:rgba(6,10,4,.88);display:flex;align-items:center;justify-content:center;padding:14px;}
  .card{background:#1b2415;border:2px solid #5a6f3a;border-radius:14px;padding:16px;max-width:392px;width:100%;max-height:94%;overflow:auto;text-align:center;}
  .card h2{margin:0 0 8px;font-size:20px;font-weight:400;color:#ffce8a;}
  .card p{font-size:13px;line-height:1.7;color:#dfe7d2;margin:6px 0;text-align:left}
  .card ol,.card ul{font-size:13px;line-height:1.7;color:#dfe7d2;padding-left:1.2em;text-align:left}
  .lvls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px;}
  .lv{background:#23311a;border:1px solid #4a5a32;border-radius:12px;padding:12px 8px;cursor:pointer;}
  .lv:active{background:#2e3f20}
  .lv.lock{opacity:.4;cursor:not-allowed}
  .lv .em{font-size:30px}
  .lv .nm{font-size:13px;margin-top:3px}
  .lv .st{font-size:11px;color:#ffd166}
  .card .big{display:block;width:100%;margin-top:12px;background:#c4561f;border:1px solid #ffb24a;color:#fff;font-family:inherit;border-radius:10px;padding:11px;font-size:15px;cursor:pointer;}
  .card .big.sub{background:#23311a;border-color:#5a6f3a}
</style>
</head>
<body>
<div id="app">
  <div class="lvlbar"><span id="lv-label">ステージ</span><span id="lv-cpu"></span></div>
  <div class="scorebar">
    <div class="sc" id="sc-you"><div class="who">あなた</div><div class="pt"><span id="you-pt">0</span><small> /50</small></div><div class="dots" id="you-dots"></div></div>
    <div class="vs">VS</div>
    <div class="sc" id="sc-cpu"><div class="who" id="cpu-name">CPU</div><div class="pt"><span id="cpu-pt">0</span><small> /50</small></div><div class="dots" id="cpu-dots"></div></div>
  </div>
  <div class="field-wrap">
    <canvas id="field" width="480" height="600"></canvas>
    <div class="toast" id="toast"></div>
    <div class="wind" id="wind" style="display:none"></div>
    <div class="tapcue" id="tapcue" style="display:none"></div>
    <div class="modal" id="select"><div class="card" id="select-card"></div></div>
    <div class="modal" id="rules" style="display:none"><div class="card" id="rules-card"></div></div>
    <div class="modal" id="result" style="display:none"><div class="card" id="result-card"></div></div>
  </div>
  <div class="bottom">
    <button class="btn" id="btn-rules">ルール</button>
    <button class="btn" id="btn-select">ステージ選択</button>
  </div>
  <div class="hint">地面を ドラッグして「まと」を きめ、はなすと 棒が とんでいく。<br>ちょうど 50てんで クリア！ かぜの ステージは ながれに 注意。</div>
</div>

<script>
/* ============ DATA ============ */
let COMMENTS={"greatThrow":["ナイススキットル！まとめてドカン！","固まってるとこ一気に持ってった！","一網打尽！これは効くね〜","ごっそり倒した！ビールがうまい一投だ"],"niceSingle":["ピンポイントで一本！シブいねぇ","狙いすました単発、お見事！","そこを抜くか〜、いい目してる","一本だけキレイに、職人技だね"],"miss":["あちゃ〜、空振り！そんな日もある","おっと0点、焚き火でも見て落ち着こ","スカッと外したね、ドンマイ","うーん届かず…次いこ次"],"bust":["やっちゃった〜50超えで25に逆戻り！","あ〜行き過ぎ！25からやり直しだ","オーバーラン！欲張っちゃったね"],"reach":["お、リーチだ！あと一押し！","ゴールが見えてきた、ここで決めたい","残りわずか、落ち着いて狙おう"],"win":["やったね！ステージクリア！","みごと！次のキャンプ地へ！"],"lose":["惜しくも敗北…もう一回！","今回は届かず、リトライしよう"]};
let HELP={"title":"モルックの あそびかた","intro":"モルック(Mölkky)はフィンランド生まれの、木の棒を投げて数字ピンを倒す的当てゲーム。手前の列が1・2、奥が7・9・8の山形に並びます。","howToThrow":"画面の地面を 指でドラッグして「まと(ねらい先)」を きめ、指を はなすと モルック棒が とんでいきます。遠く/近くも まとで ちょうせい。風のある ステージは ながれを 見こして ねらおう。","rules":["ピンを1本だけ倒すと、その『数字』が得点。","2本以上倒すと、倒した『本数』が得点(3本なら3点)。","合計ちょうど50点でクリア。","50を超えると25点に戻る(欲張り禁物)。","倒れたピンは止まった場所に立て直す→だんだん散らばる。","1本も倒せない(0点)が3回続くと失格。"],"tips":["まとを ピンの かたまりに 置くと 大量得点しやすい。","50に近づいたら『あと何点』をねらって1本に しぼろう。","風が強いほど、ねらいを 風上に ずらして 補正。"]};

const LEVELS=[
 {id:'kusahara',name:'草原キャンプ',emo:'🌿',cpu:'マシュマロめぐ',acc:0.40,wind:0,theme:'grass'},
 {id:'kawa',name:'川キャンプ',emo:'🏞️',cpu:'のんびり ぽんた',acc:0.52,wind:0.010,theme:'river'},
 {id:'umi',name:'海キャンプ',emo:'🌊',cpu:'なみのり さき',acc:0.62,wind:0.016,theme:'sea'},
 {id:'yama',name:'山キャンプ',emo:'⛰️',cpu:'キャプテンげんき',acc:0.72,wind:0.024,theme:'mountain'},
 {id:'tokai',name:'都会キャンプ',emo:'🏙️',cpu:'ルーフの たつや',acc:0.80,wind:0.032,theme:'city'},
 {id:'takibi',name:'焚き火キャンプ',emo:'🔥',cpu:'サイレント鷹',acc:0.88,wind:0.040,theme:'night'}
];
const SAVE='molkku_progress_v2';
function unlocked(){ try{ return Math.max(0,Math.min(LEVELS.length-1, JSON.parse(localStorage.getItem(SAVE)).unlocked)); }catch(e){ return 0; } }
function setUnlocked(n){ try{ const cur=unlocked(); if(n>cur) localStorage.setItem(SAVE,JSON.stringify({unlocked:n})); }catch(e){} }

/* ============ WORLD + PROJECTION ============ */
const FW=400, FD=720, RP=15, RM=12, FR=0.972, FRM=0.86, STOP=0.3, KS=1.2, REST=0.45, MASS_M=2.4, MASS_P=1, G=0.05;
const cv=document.getElementById('field'), ctx=cv.getContext('2d');
const CW=480, CH=600, CX=240, HORIZON=158, CAMZ=140, FOC=380, EYE=132;
function scaleAt(d){ return FOC/(d+CAMZ); }
function groundY(d){ return HORIZON + EYE*FOC/(d+CAMZ); }
function proj(x,d,h){ const s=scaleAt(d); return {sx:CX+(x-FW/2)*s, sy:groundY(d)-(h||0)*s, s:s}; }
function screenToGround(sx,sy){ if(sy<=HORIZON+8) return null; const d=EYE*FOC/(sy-HORIZON)-CAMZ; const s=scaleAt(d); const x=FW/2+(sx-CX)/s; return {x,d}; }
const THROWER={x:FW/2,d:14};
const FORM=[ [524,[7,9,8]], [490,[5,11,12,6]], [456,[3,10,4]], [422,[1,2]] ];

let pins=[], mol=null, you, cpu, turn='you', gstate='select', level=0, lv=LEVELS[0], aimPt=null, windX=0;

function makePins(){ pins=[]; FORM.forEach(([d,nums])=>{ const n=nums.length; nums.forEach((num,i)=>{
  pins.push({num,x:FW/2+(i-(n-1)/2)*34,y:d,vx:0,vy:0,down:false,rad:RP,mass:MASS_P}); }); }); }

/* ============ PHYSICS ============ */
function microstep(){
  const ents=(mol&&mol.phase==='slide'?[mol]:[]).concat(pins);
  ents.forEach(e=>{ e.x+=e.vx*0.5; e.y+=e.vy*0.5; const r=e.rad;
    if(e.x<r){e.x=r;e.vx=Math.abs(e.vx)*0.3;} if(e.x>FW-r){e.x=FW-r;e.vx=-Math.abs(e.vx)*0.3;}
    if(e.y<r){e.y=r;e.vy=Math.abs(e.vy)*0.3;} if(e.y>FD-r){e.y=FD-r;e.vy=-Math.abs(e.vy)*0.3;} });
  for(let i=0;i<ents.length;i++) for(let j=i+1;j<ents.length;j++) collide(ents[i],ents[j]);
}
function collide(a,b){
  const dx=b.x-a.x, dy=b.y-a.y; let d=Math.hypot(dx,dy); const min=a.rad+b.rad; if(d>=min||d===0) return;
  const nx=dx/d, ny=dy/d, ma=a.mass, mb=b.mass, overlap=min-d, totInv=1/ma+1/mb;
  a.x-=nx*overlap*(1/ma)/totInv; a.y-=ny*overlap*(1/ma)/totInv; b.x+=nx*overlap*(1/mb)/totInv; b.y+=ny*overlap*(1/mb)/totInv;
  const sa=Math.hypot(a.vx,a.vy), sb=Math.hypot(b.vx,b.vy);
  if(a.num!==undefined&&!a.down&&sb>KS){ a.down=true; a.vx-=nx*sb*0.4; a.vy-=ny*sb*0.4; }
  if(b.num!==undefined&&!b.down&&sa>KS){ b.down=true; b.vx+=nx*sa*0.4; b.vy+=ny*sa*0.4; }
  const rv=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
  if(rv<0){ const j=-(1+REST)*rv/totInv; a.vx-=j*nx/ma; a.vy-=j*ny/ma; b.vx+=j*nx/mb; b.vy+=j*ny/mb; }
}
function settleStep(){ const ents=(mol&&mol.phase==='slide'?[mol]:[]).concat(pins);
  ents.forEach(e=>{ const f=(e===mol)?FRM:FR; e.vx*=f; e.vy*=f; if(Math.hypot(e.vx,e.vy)<STOP){e.vx=0;e.vy=0;} });
  return ents.every(e=>e.vx===0&&e.vy===0);
}
function doThrow(tx,td){
  const dx=tx-THROWER.x, dd=td-THROWER.d, dist=Math.hypot(dx,dd);
  const T=clamp(dist/13,16,42);
  mol={x:THROWER.x,y:THROWER.d,h:0,vx:dx/(T+1),vy:dd/(T+1),vh:G*T/2,phase:'fly',rad:RM,mass:MASS_M};
  pins.forEach(p=>p.down=false);
  windX=(lv.wind>0)?((Math.random()<0.5?-1:1)*lv.wind):0;
  showWind();
  gstate='throwing';
}

/* ============ TURN ============ */
function resolve(){
  const dp=pins.filter(p=>p.down), cnt=dp.length;
  let pts=0; if(cnt===1)pts=dp[0].num; else if(cnt>=2)pts=cnt;
  const who=(turn==='you')?you:cpu, youT=(turn==='you');
  let busted=false;
  if(pts===0){ who.miss++; } else { who.miss=0; const ns=who.score+pts; if(ns>50){who.score=25;busted=true;} else who.score=ns; }
  pins.forEach(p=>p.down=false); mol=null; document.getElementById('wind').style.display='none';
  updateHud();
  let cm = pts===0?pick(COMMENTS.miss) : busted?pick(COMMENTS.bust) : cnt>=2?pick(COMMENTS.greatThrow):pick(COMMENTS.niceSingle);
  let res=(pts>0?('+'+pts+'てん'):'0てん')+(busted?'（50こえ→25）':'');
  toast('<b>'+(youT?'あなた':lv.cpu)+'：'+res+'</b>　'+cm);
  if(who.score===50){ youT?onWin():onLose(false); return; }
  if(who.miss>=3){ youT?onLose(true,true):onWin(); return; }
  gstate='result-wait'; setTap('タップで つづける ▶');
}
function nextTurn(){
  turn=(turn==='you')?'cpu':'you'; updateHud();
  if(turn==='cpu'){ gstate='cpuwait'; setTap(''); toast(lv.cpu+'の ばん…'); setTimeout(cpuThrow,600); }
  else { gstate='aim'; setTap(''); aimPt=null; const r=50-you.score; toast(r<=12?('リーチ気味！ 50まで あと '+r):'あなたの ばん。 まとを ドラッグ！'); render(); }
}
function cpuThrow(){
  const needed=50-cpu.score; let tx,td, exact=(needed>=1&&needed<=12)?pins.find(p=>p.num===needed):null;
  if(exact){ tx=exact.x; td=exact.y; } else { let sx=0,sd=0; pins.forEach(p=>{sx+=p.x;sd+=p.y;}); tx=sx/pins.length; td=sd/pins.length; }
  const noise=(1-lv.acc); tx+=(Math.random()*2-1)*noise*90; td+=(Math.random()*2-1)*noise*70;
  doThrow(clamp(tx,30,FW-30), clamp(td,120,600));
}

/* ============ HELPERS ============ */
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function missDots(m){let s='';for(let i=0;i<3;i++)s+=(i<m?'✕':'·');return m>0?s:'';}
function updateHud(){
  document.getElementById('you-pt').textContent=you?you.score:0;
  document.getElementById('cpu-pt').textContent=cpu?cpu.score:0;
  document.getElementById('you-dots').textContent=you?missDots(you.miss):'';
  document.getElementById('cpu-dots').textContent=cpu?missDots(cpu.miss):'';
  document.getElementById('sc-you').classList.toggle('turn',turn==='you'&&gstate!=='select');
  document.getElementById('sc-cpu').classList.toggle('turn',turn==='cpu');
}
function toast(h){ document.getElementById('toast').innerHTML=h; }
function setTap(t){ const e=document.getElementById('tapcue'); e.textContent=t; e.style.display=t?'block':'none'; }
function showWind(){ const e=document.getElementById('wind'); if(!lv.wind){e.style.display='none';return;}
  const dir=windX<0?'◀ 風':'風 ▶'; const n=Math.round(Math.abs(windX)/0.04*3); e.textContent=dir+' '+'›'.repeat(Math.max(1,n)); e.style.display='block'; }

/* ============ CHARACTER SPRITES (SVG → canvas) ============ */
function camperSVG(c){return `<svg xmlns="http://www.w3.org/2000/svg" width="100" height="132" viewBox="0 0 100 132">
<rect x="40" y="80" width="9" height="33" rx="4" fill="${c.pants}"/>
<rect x="51" y="80" width="9" height="33" rx="4" fill="${c.pants}"/>
<rect x="37" y="109" width="14" height="15" rx="5" fill="${c.boots}"/>
<rect x="49" y="109" width="14" height="15" rx="5" fill="${c.boots}"/>
<rect x="25" y="55" width="9" height="31" rx="4.5" fill="${c.jacket}"/>
<circle cx="29.5" cy="86" r="5" fill="${c.skin}"/>
<rect x="31" y="51" width="38" height="37" rx="10" fill="${c.jacket}"/>
<rect x="37" y="55" width="26" height="41" rx="7" fill="${c.pack}"/>
<rect x="37" y="55" width="26" height="14" rx="6" fill="${c.packFlap}"/>
<ellipse cx="50" cy="54" rx="15" ry="6" fill="${c.packFlap}"/>
<rect x="40" y="47" width="4" height="22" rx="2" fill="${c.packFlap}"/>
<rect x="56" y="47" width="4" height="22" rx="2" fill="${c.packFlap}"/>
<g transform="rotate(38 65 58)">
<rect x="61" y="26" width="9" height="34" rx="4.5" fill="${c.jacket}"/>
<rect x="60.5" y="12" width="10" height="17" rx="4" fill="${c.baton}"/>
<rect x="61.5" y="13" width="3" height="15" rx="1.5" fill="rgba(0,0,0,.12)"/>
<circle cx="65.5" cy="27" r="5.5" fill="${c.skin}"/>
</g>
<circle cx="50" cy="40" r="12.5" fill="${c.hair}"/>
<path d="M36.5 41 a13.5 13.5 0 0 1 27 0 z" fill="${c.beanie}"/>
<rect x="35.5" y="37" width="29" height="7.5" rx="3.7" fill="${c.beanie}"/>
<circle cx="50" cy="25.5" r="4.2" fill="${c.pom}"/>
</svg>`;}
const COL_YOU={pants:'#3a4458',boots:'#6b4a2b',jacket:'#caa23a',pack:'#2f9e8f',packFlap:'#23806f',skin:'#f0c9a8',hair:'#4a3526',beanie:'#e0552e',pom:'#ffe3b0',baton:'#caa15a'};
const COL_CPU={pants:'#33405a',boots:'#5a4631',jacket:'#7f8a96',pack:'#e0772e',packFlap:'#b85e1f',skin:'#ead0b8',hair:'#33323c',beanie:'#3f6fae',pom:'#dbe8f7',baton:'#caa15a'};
const sprites={};
function loadSprite(key,c){ const img=new Image(); img.onload=()=>{ sprites[key]=img; if(gstate!=='select') render(); }; img.src='data:image/svg+xml;charset=utf8,'+encodeURIComponent(camperSVG(c)); }
loadSprite('you',COL_YOU); loadSprite('cpu',COL_CPU);

/* ============ RENDER ============ */
function drawBackground(){
  const t=lv.theme;
  let sky=ctx.createLinearGradient(0,0,0,HORIZON+30);
  const SKIES={grass:['#8fc4ee','#dff0fb'],river:['#9fd0f2','#e6f5fb'],sea:['#7fbfe8','#eaf6fb'],mountain:['#9bc0e6','#e0ecf6'],city:['#f0a262','#ffe0b0'],night:['#0e1730','#27203e']};
  const sk=SKIES[t]; sky.addColorStop(0,sk[0]); sky.addColorStop(1,sk[1]);
  ctx.fillStyle=sky; ctx.fillRect(0,0,CW,HORIZON+30);
  // far scenery
  if(t==='mountain'){ ctx.fillStyle='#6f7f93'; tri(40,HORIZON,150,70,260,HORIZON); tri(200,HORIZON,320,54,440,HORIZON);
    ctx.fillStyle='#eef2f6'; tri(120,HORIZON-58,150,70,180,HORIZON-58); tri(292,HORIZON-72,320,54,348,HORIZON-72); }
  if(t==='grass'){ ctx.fillStyle='#7fae5a'; ctx.beginPath(); ctx.moveTo(0,HORIZON); ctx.quadraticCurveTo(120,HORIZON-26,260,HORIZON-6); ctx.quadraticCurveTo(400,HORIZON-22,480,HORIZON); ctx.closePath(); ctx.fill(); }
  if(t==='sea'){ ctx.fillStyle='#2f74b5'; ctx.fillRect(0,HORIZON-26,CW,26); ctx.fillStyle='#ffe9a8'; ctx.beginPath(); ctx.arc(370,HORIZON-58,22,0,7); ctx.fill(); }
  if(t==='river'){ ctx.fillStyle='#6aa35a'; ctx.fillRect(0,HORIZON-18,CW,18); }
  if(t==='city'){ ctx.fillStyle='#4a4658'; for(let i=0;i<9;i++){ const bx=10+i*54, bh=30+((i*7)%5)*14; ctx.fillRect(bx,HORIZON-bh,40,bh); }
    ctx.fillStyle='#ffd9a0'; for(let i=0;i<9;i++) for(let r=0;r<3;r++){ if((i+r)%2) ctx.fillRect(18+i*54+(r%2)*16,HORIZON-24-r*12,6,6);} }
  if(t==='night'){ ctx.fillStyle='#eef'; for(let i=0;i<40;i++){ const sx=(i*97)%CW, sy=(i*53)%(HORIZON-10); ctx.globalAlpha=.6; ctx.fillRect(sx,sy,2,2);} ctx.globalAlpha=1; }
  // ground
  const GR={grass:'#5f9a3e',river:'#5a9440',sea:'#d9c089',mountain:'#5f8a48',city:'#6f7a60',night:'#26331f'};
  ctx.fillStyle=GR[t]; ctx.fillRect(0,HORIZON,CW,CH-HORIZON);
  // perspective ground lines
  ctx.strokeStyle='rgba(0,0,0,.08)'; ctx.lineWidth=1;
  for(let d=80;d<FD;d+=80){ const y=groundY(d); ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(CW,y); ctx.stroke(); }
  if(t==='river'){ const y1=groundY(330),y2=groundY(250); ctx.fillStyle='rgba(70,150,210,.85)'; ctx.beginPath(); ctx.moveTo(0,y1); ctx.lineTo(CW,y1); ctx.lineTo(CW,y2); ctx.lineTo(0,y2); ctx.closePath(); ctx.fill(); }
  // throw line
  const ly=groundY(70); ctx.strokeStyle='rgba(255,255,255,.55)'; ctx.setLineDash([10,8]); ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(20,ly); ctx.lineTo(CW-20,ly); ctx.stroke(); ctx.setLineDash([]);
}
function tri(x1,y1,x2,y2,x3,y3){ ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.lineTo(x3,y3); ctx.closePath(); ctx.fill(); }
function drawPin(p){
  const pr=proj(p.x,p.y,0), s=pr.s;
  ctx.fillStyle='rgba(0,0,0,.20)'; ctx.beginPath(); ctx.ellipse(pr.sx,pr.sy,RP*s*0.9,RP*s*0.4,0,0,7); ctx.fill();
  if(p.down){ ctx.fillStyle='#b89466'; ctx.beginPath(); ctx.ellipse(pr.sx,pr.sy,RP*s*1.2,RP*s*0.6,0,0,7); ctx.fill();
    ctx.fillStyle='#7a5a32'; ctx.font='bold '+Math.max(8,14*s)+'px DotGothic16,monospace'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(p.num,pr.sx,pr.sy); return; }
  const ph=46, topY=pr.sy-ph*s, wTop=RP*s*0.8, wBot=RP*s;
  ctx.fillStyle='#e6c590'; ctx.beginPath(); ctx.moveTo(pr.sx-wBot,pr.sy); ctx.lineTo(pr.sx+wBot,pr.sy); ctx.lineTo(pr.sx+wTop,topY+4*s); ctx.lineTo(pr.sx-wTop,topY+4*s); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#d8b27a'; ctx.beginPath(); ctx.ellipse(pr.sx,topY+4*s,wTop,wTop*0.5,0,0,7); ctx.fill();
  ctx.strokeStyle='#a07a3a'; ctx.lineWidth=Math.max(1,2*s); ctx.stroke();
  ctx.fillStyle='#5a3f18'; ctx.font='bold '+Math.max(9,17*s)+'px DotGothic16,monospace'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(p.num,pr.sx,pr.sy-ph*s*0.5);
}
function drawThrower(){ const pr=proj(THROWER.x,THROWER.d,0);
  ctx.fillStyle='rgba(0,0,0,.22)'; ctx.beginPath(); ctx.ellipse(pr.sx,pr.sy+3,30,9,0,0,7); ctx.fill();
  const img=sprites[turn==='cpu'?'cpu':'you'];
  if(img){ const h=108, w=h*100/132; ctx.drawImage(img, pr.sx-w/2, pr.sy+7-h, w, h); }
  else { ctx.fillStyle='#d8503a'; ctx.fillRect(pr.sx-12,pr.sy-28,24,26); ctx.fillStyle='#f0c9a8'; ctx.beginPath(); ctx.arc(pr.sx,pr.sy-32,8,0,7); ctx.fill(); } }
function render(){
  drawBackground(); drawThrower();
  if(aimPt && gstate==='aim'){ const pr=proj(aimPt.x,aimPt.d,0), s=pr.s;
    ctx.strokeStyle='rgba(255,235,120,.9)'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(pr.sx,pr.sy,16*s+6,0,7); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(pr.sx-12,pr.sy); ctx.lineTo(pr.sx+12,pr.sy); ctx.moveTo(pr.sx,pr.sy-12); ctx.lineTo(pr.sx,pr.sy+12); ctx.stroke();
    const t0=proj(THROWER.x,THROWER.d,0); ctx.strokeStyle='rgba(255,235,120,.4)'; ctx.setLineDash([5,6]); ctx.beginPath(); ctx.moveTo(t0.sx,t0.sy); ctx.lineTo(pr.sx,pr.sy); ctx.stroke(); ctx.setLineDash([]); }
  const ents=pins.slice(); if(mol) ents.push(mol);
  ents.sort((a,b)=>b.y-a.y);
  ents.forEach(e=>{ if(e===mol){ const pr=proj(mol.x,mol.y,mol.h*6); const s=pr.s;
      const g=proj(mol.x,mol.y,0); ctx.fillStyle='rgba(0,0,0,.18)'; ctx.beginPath(); ctx.ellipse(g.sx,g.sy,RM*s,RM*s*0.4,0,0,7); ctx.fill();
      ctx.fillStyle='#c98a3a'; ctx.beginPath(); ctx.arc(pr.sx,pr.sy,Math.max(4,RM*s),0,7); ctx.fill(); ctx.strokeStyle='#7a531f'; ctx.lineWidth=2; ctx.stroke();
    } else drawPin(e); });
}

/* ============ LOOP ============ */
function loop(){
  if(gstate==='throwing'){
    if(mol.phase==='fly'){ mol.x+=mol.vx; mol.y+=mol.vy; mol.vx+=windX; mol.h+=mol.vh; mol.vh-=G;
      if(mol.h<=0){ mol.h=0; mol.phase='slide'; mol.vx*=0.42; mol.vy*=0.42; } render(); }
    else { for(let k=0;k<2;k++) microstep(); const done=settleStep(); render(); if(done) resolve(); }
  }
  requestAnimationFrame(loop);
}

/* ============ INPUT ============ */
function cpos(e){ const r=cv.getBoundingClientRect(); const cxp=(e.touches?e.touches[0].clientX:e.clientX), cyp=(e.touches?e.touches[0].clientY:e.clientY);
  return {sx:(cxp-r.left)/r.width*CW, sy:(cyp-r.top)/r.height*CH}; }
let dragging=false;
function down(e){ e.preventDefault();
  if(gstate==='result-wait'){ nextTurn(); return; }
  if(gstate!=='aim') return;
  const p=cpos(e), g=screenToGround(p.sx,p.sy); if(!g) return;
  dragging=true; aimPt={x:clamp(g.x,30,FW-30),d:clamp(g.d,120,640)}; render();
}
function moveP(e){ if(!dragging||gstate!=='aim')return; e.preventDefault(); const p=cpos(e), g=screenToGround(p.sx,p.sy); if(!g)return; aimPt={x:clamp(g.x,30,FW-30),d:clamp(g.d,120,640)}; render(); }
function up(e){ if(!dragging)return; dragging=false; if(gstate!=='aim'||!aimPt)return;
  const wob=(Math.random()*2-1)*6; doThrow(clamp(aimPt.x+wob,30,FW-30),aimPt.d); toast('えいっ！'); aimPt=null; }
cv.addEventListener('mousedown',down); cv.addEventListener('mousemove',moveP); window.addEventListener('mouseup',up);
cv.addEventListener('touchstart',down,{passive:false}); cv.addEventListener('touchmove',moveP,{passive:false}); cv.addEventListener('touchend',up);

/* ============ FLOW ============ */
function startLevel(i){
  level=i; lv=LEVELS[i]; makePins(); mol=null; you={score:0,miss:0}; cpu={score:0,miss:0}; turn='you'; gstate='aim'; aimPt=null;
  document.getElementById('cpu-name').textContent=lv.cpu;
  document.getElementById('lv-label').innerHTML='ステージ '+(i+1)+'/6　<b>'+lv.emo+' '+lv.name+'</b>';
  document.getElementById('lv-cpu').textContent='vs '+lv.cpu;
  updateHud(); toast('あなたの ばん。 まとを ドラッグ！'); setTap(''); render();
}
function onWin(){
  gstate='over'; setUnlocked(level+1);
  const last=(level>=LEVELS.length-1);
  const c=document.getElementById('result-card');
  if(last){ c.innerHTML='<h2>🏆 ぜんステージ クリア！</h2><p>6つの キャンプ地を ぜんぶ せいは！ あなたは のんびり谷の モルックチャンピオン。</p>'+
    '<button class="big" id="r-share">𝕏 で じまんする</button><button class="big sub" id="r-sel">ステージ選択へ</button>'; }
  else { const nx=LEVELS[level+1]; c.innerHTML='<h2>🎉 '+lv.name+' クリア！</h2><p>'+pick(COMMENTS.win)+'<br>つぎは <b style="color:#ffd166">'+nx.emo+' '+nx.name+'</b>（あいて：'+nx.cpu+'）。すこし むずかしくなるよ！</p>'+
    '<button class="big" id="r-next">つぎの ステージへ ▶</button><button class="big sub" id="r-sel">ステージ選択へ</button>'; }
  document.getElementById('result').style.display='flex';
  const sel=document.getElementById('r-sel'); if(sel) sel.onclick=()=>{ closeResult(); openSelect(); };
  const nb=document.getElementById('r-next'); if(nb) nb.onclick=()=>{ closeResult(); startLevel(level+1); };
  const sh=document.getElementById('r-share'); if(sh) sh.onclick=()=>{ window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent('キャンプモルックで 6ステージ ぜんクリア！ #キャンプモルック #きぼうキャンプラボ'),'_blank','noopener'); };
}
function onLose(byElim){
  gstate='over';
  const c=document.getElementById('result-card');
  c.innerHTML='<h2>くやしい… まけ</h2><p>'+pick(COMMENTS.lose)+(byElim?'<br>（3連続ミスで しっかく）':'<br>（'+lv.cpu+'が さきに 50てん）')+'</p>'+
    '<button class="big" id="r-retry">もう いっかい ▶</button><button class="big sub" id="r-sel2">ステージ選択へ</button>';
  document.getElementById('result').style.display='flex';
  document.getElementById('r-retry').onclick=()=>{ closeResult(); startLevel(level); };
  document.getElementById('r-sel2').onclick=()=>{ closeResult(); openSelect(); };
}
function closeResult(){ document.getElementById('result').style.display='none'; }
function openSelect(){
  gstate='select'; updateHud(); const un=unlocked(); const c=document.getElementById('select-card');
  c.innerHTML='<h2>ステージを えらぶ</h2><p style="text-align:center;color:#a7b89a">クリアすると つぎの キャンプ地が ひらく。だんだん むずかしくなるよ。</p>'+
   '<div class="lvls">'+LEVELS.map((L,i)=>{ const lock=i>un;
     return '<div class="lv'+(lock?' lock':'')+'" '+(lock?'':'data-lv="'+i+'"')+'><div class="em">'+(lock?'🔒':L.emo)+'</div><div class="nm">'+L.name+'</div><div class="st">'+(lock?'？？？':'vs '+L.cpu)+'</div></div>'; }).join('')+'</div>';
  document.getElementById('select').style.display='flex';
  c.querySelectorAll('[data-lv]').forEach(b=>b.onclick=()=>{ document.getElementById('select').style.display='none'; startLevel(+b.getAttribute('data-lv')); });
}
function openRules(){ const c=document.getElementById('rules-card');
  c.innerHTML='<h2>'+HELP.title+'</h2><p>'+HELP.intro+'</p><p><b style="color:#ffce8a">なげかた</b><br>'+HELP.howToThrow+'</p>'+
   '<p><b style="color:#ffce8a">ルール</b></p><ol>'+HELP.rules.map(r=>'<li>'+r+'</li>').join('')+'</ol>'+
   '<p><b style="color:#ffce8a">コツ</b></p><ul>'+HELP.tips.map(t=>'<li>'+t+'</li>').join('')+'</ul>'+
   '<button class="big" id="rules-close">とじる</button>';
  document.getElementById('rules').style.display='flex';
  document.getElementById('rules-close').onclick=()=>{ document.getElementById('rules').style.display='none'; };
}
document.getElementById('btn-rules').onclick=openRules;
document.getElementById('btn-select').onclick=openSelect;

/* ============ BOOT ============ */
makePins(); render(); openSelect(); loop();
</script>
</body>
</html>
