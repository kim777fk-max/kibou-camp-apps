  canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;}

  .hud{position:absolute;top:0;left:0;right:0;padding:5px 8px;display:flex;gap:8px;align-items:center;

  .hud .bar{display:flex;align-items:center;gap:4px;}
  .hud .meter{width:46px;height:8px;background:#06122e;border:1px solid #5a78bf;border-radius:4px;overflow:hidden;}
  .hud .meter i{display:block;height:100%;}
  .hud .hp i{background:#ff5a5a}.hud .wm i{background:#ffb24a}
  .hud .lbl{color:#9fb6e6}

  .win{position:absolute;left:8px;right:8px;background:var(--win);border:3px solid var(--winb);border-radius:10px;

  #dialog .who{color:#ffd9a8;font-size:13px;margin-bottom:2px;}
  #dialog .more{position:absolute;right:14px;bottom:8px;color:var(--accent);animation:bl 1s steps(2) infinite;}

  .dpad{display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,46px);gap:4px;}
  .dpad button,.abtn{font-family:inherit;background:#1a2030;border:1px solid #3a4356;color:#cdd6e6;border-radius:9px;

  .dpad .u{grid-area:1/2}.dpad .l{grid-area:2/1}.dpad .r{grid-area:2/3}.dpad .d{grid-area:3/2}

  .abtn.b{background:#10204a;border-color:#5a78bf;color:#cdd6e6}
  .hint{text-align:center;color:#5e6b86;font-size:11px;margin-top:8px;line-height:1.6;}

/* ============ MAP ============ */
function genMap(){
  const W=30,H=24, t=[];
  for(let y=0;y<H;y++) t.push(new Array(W).fill('.'));
  for(let x=0;x<W;x++){ t[0][x]='^'; t[H-1][x]='^'; }
  for(let y=0;y<H;y++){ t[y][0]='^'; t[y][W-1]='^'; }
  for(let x=1;x<W-1;x++){ t[1][x]='^'; t[2][x]='^'; }
  const PX=14;
  t[1][PX]='G'; t[2][PX]='*'; t[2][PX-1]='*'; t[2][PX+1]='*'; t[3][PX]='*';
  for(let y=3;y<=16;y++) t[y][PX]='#';
  for(let y=6;y<=10;y++) for(let x=23;x<=27;x++) t[y][x]='~';
  t[6][23]='.'; t[6][27]='.'; t[10][23]='.'; t[10][27]='.';
  [[8,6,3,2],[16,7,3,2],[7,10,3,2],[17,11,3,2],[10,13,3,1]].forEach(([gx,gy,gw,gh])=>{
    for(let y=gy;y<gy+gh;y++) for(let x=gx;x<gx+gw;x++) if(t[y][x]==='.') t[y][x]='g'; });
  [[5,5],[7,8],[20,5],[22,12],[6,13],[24,14],[8,9],[20,9],[11,10],[21,8],[25,16],[5,16]].forEach(([x,y])=>{ if(t[y][x]==='.') t[y][x]='T'; });
  for(let y=16;y<=21;y++) for(let x=9;x<=20;x++) if(t[y][x]==='.'||t[y][x]==='#') t[y][x]='o';
  const signs={};
  t[18][12]='s'; signs['12,18']='「のんびり谷 キャンプじょう」 ――ここが たびの きてんだ。';
  t[18][18]='s'; signs['18,18']='「どうぐや まきと炎」 みせの人 とげぞうに はなしかけよう。';
  t[8][PX+2]='s'; signs[(PX+2)+',8']='「この さき くさむら。 なにか でるかも しれん」';
  const npcs=[
    {role:'guide', x:11, y:19, dir:'down'},
    {role:'shop', x:17, y:18, dir:'down'},
    {role:'villager', x:10, y:20, dir:'right'},
    {role:'villager2', x:19, y:20, dir:'left'},
    {role:'quest', x:13, y:4, dir:'down'},
  ];
  return {tiles:t, W, H, start:{x:PX,y:20}, goal:{x:PX,y:1}, npcs, signs};
}

function expNext(){ return player.lv*30; }
function hpMax(){ let m=30+player.lv*4; for(const s in player.equip){ const g=gearById(player.equip[s]); if(g) m+=g.bonus.maxhp; } return m; }
function statVal(stat){
  let v=player.lv;
  for(const s in player.equip){ const g=gearById(player.equip[s]); if(g) v+=g.bonus[stat]||0; }
  player.skills.forEach(id=>{ const sk=skillById(id); if(sk&&sk.stat===stat) v+=sk.power; });
  if(stat==='skill_fire') v+=(player._fireBonus||0);
  if(stat==='luck') v+=2;
  if(stat==='warmth') v+=Math.floor(player.warmth/12);
  return v;
}

/* ============ RENDER ============ */
function tColor(c){return {'.':'#3f7a35','#':'#c7a368','o':'#5f8a3e','g':'#2f6b2a','~':'#2f74b5','*':'#e8eef2','^':'#6e7a86','T':'#3f7a35','s':'#3f7a35','G':'#e8eef2'}[c]||'#3f7a35';}
function drawTile(c,px,py,gx,gy){
  ctx.fillStyle=tColor(c); ctx.fillRect(px,py,TILE,TILE);
  if(c==='.'||c==='o'||c==='g'){ ctx.fillStyle=(c==='o')?'#6f9a48':((gx*7+gy*13)%4===0?'#377030':'#458a3a');
    ctx.fillRect(px+6,py+8,3,4); ctx.fillRect(px+18,py+20,3,4); }
  if(c==='g'){ ctx.fillStyle='#1f4d1c'; for(let i=0;i<4;i++){ ctx.fillRect(px+5+i*7,py+10+((i%2)*8),2,12);} ctx.fillStyle='#5fb04a'; ctx.fillRect(px+9,py+8,2,10); }
  if(c==='~'){ ctx.fillStyle='#69aee0'; ctx.fillRect(px+4,py+6,12,2); ctx.fillStyle='#2660a0'; ctx.fillRect(px+8,py+20,16,2); }
  if(c==='*'||c==='G'){ ctx.fillStyle='#d2dce6'; ctx.fillRect(px+5,py+18,8,2); ctx.fillRect(px+18,py+9,7,2); }
  if(c==='^'){ ctx.fillStyle='#5a6671'; ctx.beginPath(); ctx.moveTo(px+16,py+4); ctx.lineTo(px+30,py+30); ctx.lineTo(px+2,py+30); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#eef2f6'; ctx.beginPath(); ctx.moveTo(px+16,py+4); ctx.lineTo(px+22,py+15); ctx.lineTo(px+10,py+15); ctx.closePath(); ctx.fill(); }
  if(c==='T'){ ctx.fillStyle='#6b4a2b'; ctx.fillRect(px+14,py+20,4,9); ctx.fillStyle='#2c6b3f'; ctx.beginPath(); ctx.arc(px+16,py+15,11,0,7); ctx.fill(); ctx.fillStyle='#357a48'; ctx.beginPath(); ctx.arc(px+16,py+12,7,0,7); ctx.fill(); }
  if(c==='s'){ ctx.fillStyle='#8a6a3a'; ctx.fillRect(px+14,py+14,4,14); ctx.fillStyle='#c9a05a'; ctx.fillRect(px+7,py+8,18,9); ctx.strokeStyle='#5a4222'; ctx.strokeRect(px+7,py+8,18,9); }
  if(c==='G'){ ctx.strokeStyle='#7a7a7a'; for(let i=0;i<6;i++){ const a=i*1.05; ctx.fillStyle='#8a8a8a'; ctx.fillRect(px+15+Math.cos(a)*10-2,py+18+Math.sin(a)*6-2,4,4);}
    ctx.fillStyle='#ff7a1a'; ctx.beginPath(); ctx.moveTo(px+16,py+6); ctx.lineTo(px+22,py+20); ctx.lineTo(px+10,py+20); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#ffd166'; ctx.beginPath(); ctx.moveTo(px+16,py+12); ctx.lineTo(px+19,py+20); ctx.lineTo(px+13,py+20); ctx.closePath(); ctx.fill(); }
}
const PAL={ player:{j:'#d8503a',s:'#f0c9a8',h:'#3a2a20'}, guide:{j:'#3f9a55',s:'#f0c9a8',h:'#5a3a22'},

function drawChar(px,py,pal,dir){
  ctx.fillStyle='rgba(0,0,0,.22)'; ctx.beginPath(); ctx.ellipse(px+16,py+29,9,3,0,0,7); ctx.fill();

  ctx.fillStyle=pal.h; ctx.beginPath(); ctx.ellipse(px+16,py+8,7,4.5,0,0,7); ctx.fill();
  ctx.fillStyle='#222'; if(dir==='down'||!dir){ ctx.fillRect(px+12,py+11,2,2); ctx.fillRect(px+18,py+11,2,2);} }

function render(){
  cam.x=Math.max(0,Math.min(MAP.W-VIEW_W, player.x-7));
  cam.y=Math.max(0,Math.min(MAP.H-VIEW_H, player.y-5));
  for(let vy=0;vy<VIEW_H;vy++) for(let vx=0;vx<VIEW_W;vx++){
    const gx=cam.x+vx, gy=cam.y+vy; const c=(MAP.tiles[gy]&&MAP.tiles[gy][gx])||'^';
    drawTile(c, vx*TILE, vy*TILE, gx, gy);
  }
  // quest goal marker pulse
  MAP.npcs.forEach(n=>{ const sx=(n.x-cam.x)*TILE, sy=(n.y-cam.y)*TILE;
    if(n.x>=cam.x&&n.x<cam.x+VIEW_W&&n.y>=cam.y&&n.y<cam.y+VIEW_H) drawChar(sx,sy,PAL[n.role],n.dir); });
  drawChar((player.x-cam.x)*TILE,(player.y-cam.y)*TILE,PAL.player,player.dir);
  drawHud();
}
function drawHud(){
  const h=document.getElementById('hud');
  const hm=hpMax();
  h.innerHTML='<span class="tag">'+player.shougou+'</span>'+
    '<span class="bar"><span class="lbl">Lv</span><b>'+player.lv+'</b></span>'+
    '<span class="bar hp"><span class="lbl">体力</span><span class="meter"><i style="width:'+Math.round(player.hp/hm*100)+'%"></i></span></span>'+
    '<span class="bar wm"><span class="lbl">ぬくもり</span><span class="meter"><i style="width:'+Math.round(player.warmth)+'%"></i></span></span>'+
    '<span class="bar"><span class="lbl">こころ</span><b>'+player.kokoro+'</b></span>'+
    '<span class="tag">'+yen(player.gold)+'</span>';
}

/* ============ MOVEMENT & INTERACTION ============ */
function blocked(x,y){
  if(x<0||y<0||x>=MAP.W||y>=MAP.H) return true;
  if(!WALK.has(MAP.tiles[y][x])) return true;
  if(MAP.npcs.some(n=>n.x===x&&n.y===y)) return true;
  return false;
}
function move(dir){
  if(state!=='play') return;
  player.dir=dir;
  const d={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[dir];
  const nx=player.x+d[0], ny=player.y+d[1];
  if(blocked(nx,ny)){ render(); return; }
  player.x=nx; player.y=ny; player.steps++;
  render();
  if(encCooldown>0) encCooldown--;
  if(MAP.tiles[ny][nx]==='g' && encCooldown===0 && Math.random()<0.32){ startEncounter(); }
}
function frontTile(){ const d={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[player.dir]; return {x:player.x+d[0],y:player.y+d[1]}; }

function action(){
  if(state==='dialog'){ advanceDialog(); return; }
  if(state==='menu'){ chooseCmd(); return; }
  if(state==='encounter'){ chooseEnc(); return; }
  if(state==='play'){
    const f=frontTile();
    const npc=MAP.npcs.find(n=>n.x===f.x&&n.y===f.y);
    if(npc){ talkNpc(npc); return; }
    const sign=MAP.signs[f.x+','+f.y];
    if(sign){ say('', [sign]); return; }
    openCmd();
  }
}
function cancel(){
  if(state==='menu'){ closeCmd(); return; }
  if(state==='panel'){ closePanel(); return; }
  if(state==='dialog'){ return; }
  if(state==='play'){ openCmd(); }
}

/* ---- dialog ---- */
function say(who, lines, after){ dialogWho=who; dialogQ=lines.slice(); dialogAfter=after||null; state='dialog'; showDialog(); }
function showDialog(){
  document.getElementById('dwho').textContent=dialogWho||'';
  document.getElementById('dwho').style.display=dialogWho?'block':'none';
  document.getElementById('dtext').textContent=dialogQ[0]||'';
  document.getElementById('dialog').style.display='block';
}
function advanceDialog(){
  dialogQ.shift();
  if(dialogQ.length){ showDialog(); }
  else { document.getElementById('dialog').style.display='none'; state='play'; const a=dialogAfter; dialogAfter=null; if(a) a(); }
}
function talkNpc(npc){
  const data=NPC[npc.role];
  if(npc.role==='shop'){ say(data.name, [data.lines[0]], openShop); return; }
  if(npc.role==='quest' && !player.questActive && !player.questClear){
    say(data.name, data.lines, ()=>{ player.questActive=true; say('', [STORY.quest.brief, '【クエスト】'+STORY.quest.goal]); save(); });
    return;
  }
  say(data.name, data.lines);
}

/* ---- command menu ---- */
function openCmd(){
  cmdItems=['はなす','しらべる','どうぐ','たき火','スキル','つよさ'];
  cmdSel=0; state='menu'; renderCmd();
}
function renderCmd(){
  const el=document.getElementById('cmd');
  el.innerHTML=cmdItems.map((t,i)=>'<div class="it'+(i===cmdSel?' sel':'')+'">'+t+'</div>').join('');
  el.style.display='grid';
  [...el.children].forEach((c,i)=>c.onclick=()=>{ cmdSel=i; chooseCmd(); });
}
function closeCmd(){ document.getElementById('cmd').style.display='none'; state='play'; }
function moveCmd(dy,dx){ if(dy) cmdSel=(cmdSel+dy*2+6)%6; if(dx) cmdSel=(cmdSel+dx+6)%6; renderCmd(); }
function chooseCmd(){
  const t=cmdItems[cmdSel]; closeCmd();
  if(t==='はなす'||t==='しらべる'){ const f=frontTile(); const npc=MAP.npcs.find(n=>n.x===f.x&&n.y===f.y);
    if(npc){ talkNpc(npc); } else { const s=MAP.signs[f.x+','+f.y]; say('', [s|| (t==='しらべる'?'とくに なにも ないようだ。':'だれも いない。 ふりむけば だれか いるかも。')]); } return; }
  if(t==='どうぐ'){ openPanel('inv'); return; }
  if(t==='スキル'){ openPanel('skill'); return; }
  if(t==='つよさ'){ openPanel('status'); return; }
  if(t==='たき火'){ doCamp(); return; }
}

/* ---- camp ---- */
function doCamp(){
  const onGoal=(player.x===MAP.goal.x&&player.y===MAP.goal.y)||(MAP.tiles[player.y][player.x]==='G');
  if(onGoal && player.questActive && !player.questClear){
    player.questClear=true; player.exp+=STORY.quest.rewardExp; player.gold+=STORY.quest.rewardGold*GOLD_MULT;
    const lvMsgs=checkLevel();
    say('', [STORY.quest.clearText, 'けいけんち +'+STORY.quest.rewardExp+' ／ '+yen(STORY.quest.rewardGold*GOLD_MULT)+' を てにいれた！', ...lvMsgs], ()=>{ save(); showEnding(); });
    return;
  }
  player.hp=hpMax(); player.warmth=Math.min(100,player.warmth+25); player.kokoro+=2;
  say('', [STORY.systemCopy.camp], ()=>{ save(); render(); });
}

/* ---- encounter ---- */
function startEncounter(){
  encData=ENCOUNTERS[Math.floor(Math.random()*ENCOUNTERS.length)]; encSel=0; state='encounter';
  say('', [STORY.systemCopy.encounterIntro, encData.symbol+' '+encData.title, encData.situation], showEncMenu);
}
function showEncMenu(){
  state='encounter';
  const el=document.getElementById('cmd');
  el.style.display='grid'; el.style.gridTemplateColumns='1fr';
  el.style.bottom='16px'; el.style.right='8px'; el.style.left='8px';
  el.innerHTML=encData.options.map((o,i)=>'<div class="it'+(i===encSel?' sel':'')+'">'+o.label+' <span style="color:#9fb6e6;font-size:11px">['+statLabel(o.stat)+']</span></div>').join('');
  [...el.children].forEach((c,i)=>c.onclick=()=>{ encSel=i; chooseEnc(); });
}
function statLabel(s){ return {warmth:'ぬくもり',skill_fire:'火',skill_cook:'料理',skill_weather:'天気',luck:'うん'}[s]||s; }
function moveEnc(dy){ encSel=(encSel+dy+encData.options.length)%encData.options.length; showEncMenu(); }
function chooseEnc(){
  const o=encData.options[encSel];
  const el=document.getElementById('cmd'); el.style.display='none'; el.style.gridTemplateColumns=''; el.style.left=''; el.style.bottom='100px';
  const v=statVal(o.stat), roll=v+1+Math.floor(Math.random()*6), ok=roll>=o.difficulty*3+2;
  const r=ok?o.success:o.fail;
  player.hp-=4;
  player.exp+=r.exp; player.kokoro+=r.kokoro; player.gold=Math.max(0,player.gold+r.gold*GOLD_MULT);
  player.warmth=Math.max(0,Math.min(100,player.warmth+r.warmth));
  encCooldown=3;
  const lines=[ (ok?'✦ ':'')+r.text ];
  const gains=[]; if(r.exp)gains.push('けいけんち+'+r.exp); if(r.gold>0)gains.push(yen(r.gold*GOLD_MULT)); if(r.kokoro>0)gains.push('こころ+'+r.kokoro);
  if(gains.length) lines.push(gains.join(' ／ '));
  lines.push(...checkLevel());
  say('', lines, ()=>{ if(player.hp<=0){ faint(); } save(); render(); });
}
function faint(){ say('', ['つかれて めを とじた……','ふと きづくと、谷の キャンプ場に もどっていた。'], ()=>{ player.x=MAP.start.x; player.y=MAP.start.y; player.hp=hpMax(); player.warmth=Math.max(player.warmth,50); render(); }); }

/* ---- level ---- */
function checkLevel(){
  const msgs=[];
  while(player.exp>=expNext()){ player.exp-=expNext(); player.lv++; player.hp=hpMax();
    msgs.push(STORY.systemCopy.levelUp.replace('{lv}',player.lv));
    SKILLS.filter(s=>s.learnLv===player.lv).forEach(s=>{ if(!player.skills.includes(s.id)){ player.skills.push(s.id); msgs.push('あたらしいスキル「'+s.name+'」を おぼえた！'); } });
  }
  return msgs;
}

/* ---- panels: inventory / shop / status / skill ---- */
function openPanel(mode){ panelMode=mode; state='panel'; renderPanel(); }
function openShop(){ panelMode='shop'; state='panel'; renderPanel(); }
function closePanel(){ document.getElementById('panel').style.display='none'; state='play'; render(); }
function rakuten(kw){ return 'https://search.rakuten.co.jp/search/mall/'+encodeURIComponent(kw)+'/'; }
function bonusStr(b){ const m={warmth:'ぬくもり',kokoro:'こころ',skill_fire:'火',skill_cook:'料理',skill_weather:'天気',maxhp:'体力'};
  return Object.keys(b).filter(k=>b[k]).map(k=>m[k]+'+'+b[k]).join(' '); }
function renderPanel(){
  const el=document.getElementById('panel'); el.style.display='block'; let h='';
  if(panelMode==='shop'){
    h+='<h3>どうぐや「まきと炎」　'+yen(player.gold)+'</h3>';
    GEAR.forEach(g=>{ const own=player.owned.includes(g.id);
      h+='<div class="row"><div class="nm">'+g.name+'<div class="fl">'+g.flavor+'<br>'+bonusStr(g.bonus)+'</div></div>'+
         '<span class="pr">'+yen(g.price)+'</span>'+
         (own?'<button disabled>しょゆうずみ</button>':'<button data-buy="'+g.id+'">かう</button>')+
         '<a class="rk" href="'+rakuten(g.rakutenKeyword)+'" target="_blank" rel="nofollow sponsored noopener">楽天</a></div>'; });
  } else if(panelMode==='inv'){
    h+='<h3>そうび・もちもの</h3>';
    ['tent','sleep','fire','cook','light','chair'].forEach(slot=>{
      const owned=player.owned.map(gearById).filter(g=>g&&g.slot===slot);
      if(!owned.length) return;
      h+='<div class="slotlbl">'+({tent:'テント',sleep:'シュラフ',fire:'焚き火',cook:'調理',light:'照明',chair:'チェア'}[slot])+'</div>';
      owned.forEach(g=>{ const eq=player.equip[slot]===g.id;
        h+='<div class="row"><div class="nm">'+g.name+'<div class="fl">'+bonusStr(g.bonus)+'</div></div>'+
           (eq?'<span class="equipped">そうび中</span>':'<button data-eq="'+g.id+'">そうび</button>')+'</div>'; });
    });
  } else if(panelMode==='status'){
    h+='<h3>つよさ　'+player.shougou+'</h3>';
    h+='<div class="row"><div class="nm">レベル</div><b>'+player.lv+'</b></div>';
    h+='<div class="row"><div class="nm">けいけんち（つぎまで）</div><b>'+(expNext()-player.exp)+'</b></div>';
    h+='<div class="row"><div class="nm">体力</div><b>'+player.hp+' / '+hpMax()+'</b></div>';
    h+='<div class="row"><div class="nm">ぬくもり</div><b>'+Math.round(player.warmth)+'</b></div>';
    h+='<div class="row"><div class="nm">こころ（満足度）</div><b>'+player.kokoro+'</b></div>';
    h+='<div class="row"><div class="nm">しょじきん</div><b>'+yen(player.gold)+'</b></div>';
    h+='<div class="slotlbl">のうりょく</div>';
    [['skill_fire','火おこし'],['skill_cook','料理'],['skill_weather','天気'],['warmth','ぬくもり'],['luck','うん']].forEach(([s,l])=>{
      h+='<div class="row"><div class="nm">'+l+'</div><b>'+statVal(s)+'</b></div>'; });
  } else if(panelMode==='skill'){
    h+='<h3>おぼえた スキル</h3>';
    if(!player.skills.length) h+='<div class="row"><div class="nm fl">まだ なにも おぼえていない。レベルを あげよう。</div></div>';
    player.skills.map(skillById).forEach(s=>{ h+='<div class="row"><div class="nm">'+s.name+'<div class="fl">'+s.desc+'</div></div><b>'+statLabel(s.stat)+'+'+s.power+'</b></div>'; });
    h+='<div class="slotlbl">これから おぼえる</div>';
    SKILLS.filter(s=>!player.skills.includes(s.id)).forEach(s=>{ h+='<div class="row"><div class="nm fl">Lv'+s.learnLv+'：'+s.name+'</div></div>'; });
  }
  h+='<button class="close" data-close="1">とじる（B）</button>';
  el.innerHTML=h;
  el.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>buy(b.getAttribute('data-buy')));
  el.querySelectorAll('[data-eq]').forEach(b=>b.onclick=()=>{ equip(b.getAttribute('data-eq')); renderPanel(); });
  el.querySelector('[data-close]').onclick=closePanel;
}
function buy(id){ const g=gearById(id); if(!g||player.owned.includes(id)||player.gold<g.price) return;
  player.gold-=g.price; player.owned.push(id);
  if(!player.equip[g.slot]) player.equip[g.slot]=id;
  player.hp=Math.min(player.hp,hpMax()); save(); renderPanel(); }
function equip(id){ const g=gearById(id); if(!g) return; player.equip[g.slot]=id; player.hp=Math.min(hpMax(),Math.max(player.hp,1)); save(); }

/* ---- ending ---- */
function showEnding(){
  state='ending';
  document.getElementById('e-stats').innerHTML='称号「'+player.shougou+'」<br>Lv '+player.lv+' ／ こころ（満足度）'+player.kokoro+' ／ '+yen(player.gold)+'<br>のんびり谷の あさを、みとどけた。';
  document.getElementById('ending').style.display='flex';
}

/* ---- save/load ---- */
function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(player)); }catch(e){} }
function hasSave(){ try{ return !!localStorage.getItem(SAVE_KEY); }catch(e){ return false; } }
function load(){ try{ const p=JSON.parse(localStorage.getItem(SAVE_KEY)); if(p){ player=p; return true; } }catch(e){} return false; }

/* ============ INPUT ============ */
window.addEventListener('keydown',e=>{
  const k=e.key;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(k)) e.preventDefault();
  if(state==='title'||state==='ending') return;
  if(state==='play'){
    if(k==='ArrowUp'||k==='w')move('up'); else if(k==='ArrowDown'||k==='s')move('down');
    else if(k==='ArrowLeft'||k==='a')move('left'); else if(k==='ArrowRight'||k==='d')move('right');
    else if(k==='Enter'||k==='z'||k==='Z'||k===' ')action(); else if(k==='Escape'||k==='x'||k==='X')cancel();
  } else if(state==='menu'){
    if(k==='ArrowUp')moveCmd(-1,0); else if(k==='ArrowDown')moveCmd(1,0);
    else if(k==='ArrowLeft')moveCmd(0,-1); else if(k==='ArrowRight')moveCmd(0,1);
    else if(k==='Enter'||k==='z'||k==='Z'||k===' ')chooseCmd(); else if(k==='Escape'||k==='x'||k==='X')closeCmd();
  } else if(state==='encounter'){
    if(k==='ArrowUp')moveEnc(-1); else if(k==='ArrowDown')moveEnc(1);
    else if(k==='Enter'||k==='z'||k==='Z'||k===' ')chooseEnc();
  } else if(state==='dialog'){
    if(k==='Enter'||k==='z'||k==='Z'||k===' ')advanceDialog();
  } else if(state==='panel'){
    if(k==='Escape'||k==='x'||k==='X'||k==='Enter')closePanel();
  }
});
document.querySelectorAll('.dpad button[data-dir]').forEach(b=>{
  const dir=b.getAttribute('data-dir');
  b.addEventListener('pointerdown',e=>{ e.preventDefault();
    if(state==='play')move(dir); else if(state==='menu'){ if(dir==='up')moveCmd(-1,0); else if(dir==='down')moveCmd(1,0); else if(dir==='left')moveCmd(0,-1); else moveCmd(0,1);}
    else if(state==='encounter'){ if(dir==='up')moveEnc(-1); else if(dir==='down')moveEnc(1);} });
});
document.getElementById('btn-a').addEventListener('pointerdown',e=>{e.preventDefault();action();});
document.getElementById('btn-b').addEventListener('pointerdown',e=>{e.preventDefault();cancel();});

/* ============ BOOT ============ */
function startGame(fresh){
  MAP=genMap();
  if(fresh){ const {p,inherited}=newPlayer(); player=p; player.x=MAP.start.x; player.y=MAP.start.y;
    document.getElementById('title').style.display='none'; state='play'; render(); save();
    const intro=[STORY.title.intro]; if(inherited) intro.push('（沼度診断の けっか「'+inherited.tier+'」を ひきつぎ、称号「'+inherited.shougou+'」で はじまる）');
    say('', intro, ()=>{ say(NPC.guide.name, NPC.guide.lines); });
  } else {
    load(); if(player.x==null){player.x=MAP.start.x;player.y=MAP.start.y;}
    document.getElementById('title').style.display='none'; state='play'; render();
  }
}
function initTitle(){
  document.getElementById('t-name').textContent=STORY.title.name;
  document.getElementById('t-sub').textContent=STORY.title.subtitle;
  if(hasSave()) document.getElementById('btn-continue').style.display='inline-block';
  let tip='';
  try{ const s=JSON.parse(localStorage.getItem('camp_numado_v1')); if(s&&s.snapshots&&s.snapshots.length){ tip='前回の沼度診断「'+(s.snapshots[s.snapshots.length-1].tier||'')+'」を 称号として ひきつげます'; } }catch(e){}
  document.getElementById('t-tier').textContent=tip;
}
document.getElementById('btn-new').onclick=()=>startGame(true);
document.getElementById('btn-continue').onclick=()=>startGame(false);
document.getElementById('e-cont').onclick=()=>{ document.getElementById('ending').style.display='none'; state='play'; render(); };
document.getElementById('e-share').onclick=()=>{ const t='『'+STORY.title.name+'』であさの けしきを みとどけた。称号「'+player.shougou+'」こころ満足度'+player.kokoro+'！ #キャンプクエスト #きぼうキャンプラボ';
  window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent(t),'_blank','noopener'); };
initTitle();
</script>
